name: Send instant deal alert

on:
  workflow_dispatch:
    inputs:
      alert_commit:
        description: Full commit SHA containing the products to notify
        required: true
        type: string
      skip_asins:
        description: Comma-separated ASINs already notified
        required: false
        type: string
  push:
    branches: [main]
    paths: [index.html]

permissions:
  contents: read

jobs:
  notify-subscribers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send alerts for new product cards
        env:
          ALERT_COMMIT: ${{ inputs.alert_commit }}
          SKIP_ASINS: ${{ inputs.skip_asins }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: BrightDeals
          BREVO_ALERT_LIST_ID: '4'
          SITE_URL: https://brightdeals.github.io/
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1004399602499'
        run: node scripts/send-deal-alert.js
